<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wrist Conditions Learning Modules — FT300 PT500</title>
  <meta name="description" content="Upper Extremity Orthopedic Treatment - Wrist & Hand Common Conditions Learning Platform">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#1281e2",
            "background-light": "#f6f7f8",
            "background-dark": "#101a22",
          },
          fontFamily: {
            "display": ["Lexend", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen font-display">
  <div class="relative flex flex-col w-full min-h-screen overflow-x-hidden">

    <!-- Header -->
    <header class="sticky top-0 z-50 w-full border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md px-6 md:px-10 py-3">
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.hash='#/'">
          <div class="w-9 h-9 bg-primary text-white rounded-lg flex items-center justify-center">
            <span class="material-symbols-outlined text-xl">school</span>
          </div>
          <div>
            <h2 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white leading-none">Wrist Conditions</h2>
            <p class="text-[10px] text-slate-500 font-medium">FT300 PT500</p>
          </div>
        </div>

        <nav class="hidden md:flex items-center gap-6">
          <a class="text-sm font-medium hover:text-primary transition-colors cursor-pointer" onclick="window.location.hash='#/'">Home</a>
        </nav>

        <div class="flex items-center gap-3">
          <button id="dark-mode-toggle" class="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors" title="Toggle dark mode">
            <span class="material-symbols-outlined">dark_mode</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main id="app" class="max-w-7xl mx-auto w-full px-6 md:px-10 py-8 flex-1">
      <!-- Loading state -->
      <div class="flex items-center justify-center py-20">
        <div class="text-center">
          <div class="w-12 h-12 border-4 border-primary/30 border-t-primary rounded-full animate-spin mx-auto mb-4"></div>
          <p class="text-slate-500">Loading...</p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-8 px-6 md:px-10">
      <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-2 text-primary">
          <span class="material-symbols-outlined text-xl">school</span>
          <h2 class="text-sm font-bold tracking-tight">Wrist Conditions Learning Modules</h2>
        </div>
        <p class="text-xs text-slate-400">Upper Extremity Orthopedic Treatment — FT300 PT500</p>
      </div>
    </footer>
  </div>

  <!-- App Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
